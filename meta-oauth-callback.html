<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Connecting Northgate Social Analytics</title>
</head>
<body>
  <main>
    <h1>Connecting Northgate Social Analytics</h1>
    <p id="status">Returning authorization to the secure local service.</p>
  </main>
  <script>
    const localCallback = new URL('http://127.0.0.1:8765/callback');
    localCallback.search = window.location.search;

    if (window.location.search) {
      window.location.replace(localCallback.toString());
    } else {
      document.getElementById('status').textContent =
        'No authorization response was provided. You can close this window.';
    }
  </script>
</body>
</html>
